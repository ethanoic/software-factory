# The factory's nextest profile (runner-images/rust). Writes JUnit XML the factory reads, never stops at
# the first failure, and kills any single test after 60 s, like the Python and Node runners.
[profile.factory]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.factory.junit]
path = "junit.xml"
