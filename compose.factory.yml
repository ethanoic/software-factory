# The whole factory: one service on this computer, with its own database. Start it with `make up`.
# Langfuse is optional and runs elsewhere (README "Optional: Langfuse"); it is off unless you turn it on.
name: factory

x-orchestrator-env: &orch_env
  FACTORY_DB_DSN: postgresql://factory:${FACTORY_DB_PASSWORD}@postgres:5432/factory
  POOL_FILE: /app/pool.yaml
  QUALIFICATION_DIR: /app/qualification
  OMLX_BASE_URL: http://host.docker.internal:8000/v1
  BROKER_URL: http://sandbox-broker:8080
  RUNS_ROOT: /runs
  LANGFUSE_DISABLED: ${LANGFUSE_DISABLED:-1}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
  LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
  RUN_CAP_USD: "2.00"
  DAY_CAP_USD: "10.00"
  FACTORY_TZ: Asia/Singapore
  HTTP_PROXY: http://egress-proxy:8888
  HTTPS_PROXY: http://egress-proxy:8888
  http_proxy: http://egress-proxy:8888
  https_proxy: http://egress-proxy:8888
  NO_PROXY: postgres,sandbox-broker,localhost
  no_proxy: postgres,sandbox-broker,localhost
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"     # Agent SDK: no telemetry or update checks

x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=256m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  control:   { internal: true }    # orchestrator <-> broker <-> proxy
  data:      { internal: true }    # orchestrator <-> postgres, langfuse
  egress:    {}                    # proxy only
  dockerapi: { internal: true }    # broker <-> docker-proxy only

# The factory's git clones and frozen tests live here, in a Docker volume no runner ever mounts.
# (Runners get their own throwaway volumes from the broker; see sandbox_broker/app.py.)
volumes:
  factory-runs: {}
  factory-db: {}                   # the factory's database: runs, projects, model pool, cost ledger

services:
  orchestrator:
    <<: *hardened
    build: ./orchestrator
    command: ["factory.runner", "serve"]
    networks: [control, data]
    environment: *orch_env
    env_file: [.env.factory]       # LANGFUSE_*_KEY, ALERT_WEBHOOK_URL, optional keys (Claude token: secrets/)
    secrets: [github_token, claude_oauth_token]
    volumes:
      - ./workspace:/workspace:rw          # inbox/ only
      - factory-runs:/runs                 # clones, frozen tests, results: never mounted into a runner
      - ./hoststat:/hoststat:ro
      - ./pool.yaml:/app/pool.yaml:ro
      - ./qualification:/app/qualification:ro
      - ./github.yaml:/app/github.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      sandbox-broker: { condition: service_started }
      egress-proxy: { condition: service_started }
    mem_limit: 1g
    restart: unless-stopped

  pool-worker:
    <<: *hardened
    build: ./orchestrator
    command: ["factory.pool_worker", "serve"]
    networks: [control, data]
    environment: *orch_env
    env_file: [.env.factory]
    secrets: [github_token, claude_oauth_token]
    volumes:
      - ./workspace:/workspace:rw          # inbox/ only
      - factory-runs:/runs                 # clones, frozen tests, results: never mounted into a runner
      - ./hoststat:/hoststat:ro
      - ./pool.yaml:/app/pool.yaml:ro
      - ./qualification:/app/qualification:ro
      - ./github.yaml:/app/github.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      sandbox-broker: { condition: service_started }
      egress-proxy: { condition: service_started }
    mem_limit: 768m
    restart: unless-stopped

  sandbox-broker:                  # starts sealed runners; no host folders, no Docker socket, no egress
    <<: *hardened
    build: ./sandbox_broker
    networks: [control, dockerapi]
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on: [docker-proxy]
    mem_limit: 512m
    restart: unless-stopped

  docker-proxy:                    # the only holder of the Docker socket; allows container + volume calls only
    image: tecnativa/docker-socket-proxy:v0.4.2
    networks: [dockerapi]
    environment:
      CONTAINERS: 1                # create, archive in/out, wait, logs, remove
      VOLUMES: 1                   # per-run volumes
      POST: 1                      # write methods (POST/PUT/DELETE) on the sections above
      ALLOW_START: 1
      ALLOW_RESTARTS: 1            # kill, for runners that pass the wall clock
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      BUILD: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    restart: unless-stopped

  egress-proxy:
    image: vimagick/tinyproxy
    networks: [control, egress]
    volumes:
      - ./proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./proxy/allow:/etc/tinyproxy/allow:ro
    mem_limit: 64m
    restart: unless-stopped

  board:                           # the factory board: http://localhost:8090 (read-only, see README)
    <<: *hardened
    build: ./orchestrator
    command: ["factory.board", "serve"]
    networks: [data, default]      # default only so the port can be published; the board calls nothing out
    ports: ["127.0.0.1:8090:8090"] # this Mac only, never the LAN
    environment:
      BOARD_DB_DSN: postgresql://factory_board:${FACTORY_BOARD_DB_PASSWORD}@postgres:5432/factory
      WORKSPACE_ROOT: /workspace
      LANGFUSE_DISABLED: ${LANGFUSE_DISABLED:-1}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      FACTORY_DOCS_URL: https://github.com/ethanoic/software-factory/blob/main
      FACTORY_TZ: Asia/Singapore
    volumes:
      - ./workspace/inbox:/workspace/inbox:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 128m
    restart: unless-stopped

  postgres:                        # the factory's own database; reachable only on the internal data network
    image: postgres:16.14-alpine
    networks: [data]
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${FACTORY_DB_PASSWORD:?set FACTORY_DB_PASSWORD in .env.factory}
      FACTORY_BOARD_DB_PASSWORD: ${FACTORY_BOARD_DB_PASSWORD:?set FACTORY_BOARD_DB_PASSWORD in .env.factory}
    volumes:
      - factory-db:/var/lib/postgresql/data
      - ./orchestrator/sql/initdb:/docker-entrypoint-initdb.d:ro   # first start only: the board's read-only role
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128m
    mem_limit: 512m
    restart: unless-stopped

secrets:
  github_token:
    file: ./secrets/github_token
  claude_oauth_token:              # written by `make claude-token` (scripts/claude-token.sh)
    file: ./secrets/claude_oauth_token
