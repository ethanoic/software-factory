name: Factory task
description: A small, testable change for the AI Software Factory. A maintainer adds the factory:ready label to start it.
title: "[factory] "
body:
  - type: markdown
    attributes:
      value: |
        The factory works best on changes that touch **3 files or fewer** and can be checked by unit tests.
        Creating this issue does **not** start a run: a maintainer adds the `factory:ready` label when it is ready.
        Avoid words like *secret, password, credentials, API key, migration, infrastructure, Dockerfile*:
        the factory rejects those tickets automatically, because they need a human.
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: One or two sentences, in terms of behaviour.
      placeholder: greet() should ignore surrounding whitespace in the name.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Concrete input → output examples. The factory turns these into tests before writing code.
      placeholder: |
        - greet("  Ada ") returns "Hello, Ada!"
        - greet("   ") returns "Hello, World!"
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Files likely involved (optional)
      placeholder: src/greet.js
