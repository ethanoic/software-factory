# Egress allowlist proxy (rule R7). Only hosts in /etc/tinyproxy/allow are reachable.
# The proxy sits only on internal networks, so it accepts any client there.
Port 8888
Timeout 600
LogLevel Info
MaxClients 50
Allow 0.0.0.0/0
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/allow"
ConnectPort 443
ConnectPort 8000
